name: Continuous Integration & DevSecOps

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "infra/**"
      - "refactor/**"

jobs:
  security-and-build:
    name: Security Scan & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Generate Timestamp Variable (e.g., 2026-08-15 or 2026-08-15-1652)
      - name: Set Date Stamp
        id: date
        run: echo "TIMESTAMP=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_ENV

      # 2. Secret Scanning
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog-action@main
        with:
          extra_args: --only-verified

      # 3. Run Trivy Scan & Output Named Date Report
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          config-path: 'trivy.yaml'
          format: 'json'
          output: 'report-${{ env.TIMESTAMP }}.json'

      # 4. Upload Dated Report as GitHub Artifact
      - name: Upload Trivy Dated Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ env.TIMESTAMP }}
          path: report-${{ env.TIMESTAMP }}.json
          retention-days: 14

      # 5. Print Summary Table in CI Logs
      - name: Display Trivy Terminal Summary
        run: |
          npx trivy fs . --config trivy.yaml

      # 6. Build Docker Services (Laravel, Vue, DB)
      - name: Build Docker Services
        run: |
          cp .env.example .env
          docker compose build