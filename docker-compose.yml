services:
  # 1. Database Service (PostgreSQL)
  database:
    image: postgres:15-alpine
    container_name: app_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-globalrental}
      POSTGRES_USER: ${DB_USERNAME:-grader}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-grader} -d ${DB_DATABASE:-globalrental}"]
      interval: 5s
      timeout: 5s
      retries: 5
  # 1b. Database Service for Testing (PostgreSQL isolated)
  database_test:
    image: postgres:15-alpine
    container_name: app_database_test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE_TEST:-globalrental_test}
      POSTGRES_USER: ${DB_USERNAME:-grader}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT_TEST:-5434}:5432"
    volumes:
      - db_test_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-grader} -d ${DB_DATABASE_TEST:-globalrental_test}"]
      interval: 5s
      timeout: 5s
      retries: 5
  # 2. Backend Service (Laravel API)
  backend:
    image: global-rental-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_backend
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-Global Rental Car}"
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:YARdn/q9W0xKw0hF9hLUVk/ImrfeRGR+06Y1fEEV6/A=}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-globalrental}
      DB_USERNAME: ${DB_USERNAME:-grader}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai_service:5000}
      # Frontend address used in e-mail links (password reset, e-mail verification)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Mail: "log" writes to storage/logs/laravel.log, "smtp" really sends.
      # Put the real values in your own .env, never here.
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@globalrental.local}
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Global Rental Car}"
      # Security settings (F-04, F-06, F-11)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3333}
      SANCTUM_TOKEN_PREFIX: ${SANCTUM_TOKEN_PREFIX:-grcm_}
      SANCTUM_TOKEN_EXPIRATION: ${SANCTUM_TOKEN_EXPIRATION:-1440}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      database:
        condition: service_healthy
      database_test:
        condition: service_healthy
    networks:
      - app_network

  # 3. Frontend Service (Vue 3 SPA / Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app_network

  # 4. AI Service (Python / FastAPI)
  ai_service:
    build:
      context: ./AI
      dockerfile: Dockerfile
    container_name: app_ai_service
    restart: unless-stopped
    environment:
      PORT: 5000
    ports:
      - "${AI_PORT:-5000}:5000"
    volumes:
      - ./AI:/app
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  db_test_data:      # ← NOUVEAU
    driver: local    # ← NOUVEAU
  backend_vendor:
    driver: local