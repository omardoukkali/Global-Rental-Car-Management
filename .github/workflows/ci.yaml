name: CI Pipeline

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'infra/**'
      - 'refactor/**'
      - 'hotfix/**'

  pull_request:
    branches:
      - develop
      - main

jobs:
  build-test-security:
    name: Build, Test & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          cp .env.example .env

      - name: Build Docker images
        run: |
          docker compose build

      - name: Start services
        run: |
          docker compose up -d

      - name: Wait for services and assert health
        run: |
          echo "Waiting for services to boot..."
          sleep 30
          docker compose ps
          echo "Probing backend health endpoint..."
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors http://localhost:8000/up
          echo "Probing AI service..."
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors http://localhost:5000/docs
          echo "All services healthy."

      - name: Validate Composer dependencies
        run: |
          docker compose exec -T backend composer validate --strict

      - name: Verify Vite manifest was built into the image
        run: |
          docker compose exec -T backend test -f public/build/manifest.json
          echo "Vite manifest present."

      # --- TRIVY SECURITY SCANS ---
      # NOTE: pinned to @master pending selection of a valid release tag.
      - name: Run Trivy vulnerability scanner on Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'global-rental-backend:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner on Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'global-rental-car-management-frontend:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner on AI Service Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'global-rental-car-management-ai_service:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy File System Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Bring down services
        if: always()
        run: |
          docker compose down --volumes --remove-orphans