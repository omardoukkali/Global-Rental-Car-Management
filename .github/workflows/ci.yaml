name: CI Pipeline

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'infra/**'
      - 'refactor/**'
      - 'hotfix/**'

  pull_request:
    branches:
      - develop
      - main

jobs:
  build-test-security:
    name: Build, Test & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          cp .env.example .env

      - name: Build Docker images
        run: |
          docker compose build

      - name: Start services
        run: |
          docker compose up -d

      - name: Wait for containers to stabilize & check logs
        run: |
          echo "Waiting for services to boot..."
          sleep 10
          docker compose ps
          docker compose logs backend || true

      - name: Generate Application Key
        run: |
          docker compose exec -T backend php artisan key:generate

      - name: Check container health
        run: |
          docker compose ps

      - name: Validate Composer dependencies
        run: |
          docker compose exec -T backend composer validate --strict

      # --- TRIVY SECURITY SCANS ---
      - name: Run Trivy vulnerability scanner on Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'global-rental-backend:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy File System Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Bring down services
        if: always()
        run: |
          docker compose down --volumes --remove-orphans