name: CI Pipeline

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'infra/**'
      - 'refactor/**'
      - 'hotfix/**'

  pull_request:
    branches:
      - develop
      - main

jobs:
  build-test-security:
    name: Build, Test & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          cp .env.example .env

      - name: Build Docker images
        run: |
          docker compose build

      - name: Start services
        run: |
          docker compose up -d

      - name: Wait for services and assert health
        run: |
          echo "Waiting for services to boot..."
          sleep 30
          docker compose ps

          if docker compose ps --status restarting --quiet | grep -q .; then
            echo "::error::One or more containers are crash-looping"
            docker compose logs
            exit 1