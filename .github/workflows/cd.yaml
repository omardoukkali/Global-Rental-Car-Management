name: Continuous Deployment

# Ne se déclenche pas sur un push directement.
# Il attend la fin du workflow "CI Pipeline" et ne s'exécute
# que si celui-ci a réussi, sur la branche main.
on:
  workflow_run:
    workflows: ["CI Pipeline"]     # doit correspondre au `name:` de ci.yaml
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    # Le "gate" : on déploie seulement si la CI est verte ET que c'est bien main
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/global-rental-car-management

            # on retient le commit actuel pour pouvoir revenir en arrière
            PREVIOUS=$(git rev-parse HEAD)

            git pull origin main
            docker compose up -d --build
            docker image prune -f

            echo "Vérification de l'état de l'application..."
            if ! curl --fail --silent --show-error \
                  --retry 15 --retry-delay 5 --retry-all-errors \
                  http://localhost:8000/up; then
              echo "Back-end en échec — retour à la version $PREVIOUS"
              git reset --hard "$PREVIOUS"
              docker compose up -d --build
              exit 1
            fi

            curl --fail --silent --show-error \
              --retry 10 --retry-delay 5 --retry-all-errors \
              http://localhost:5000/docs

            echo "Déploiement vérifié et fonctionnel."