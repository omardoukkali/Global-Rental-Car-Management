name: Continuous Deployment

# Waits for the "CI Pipeline" workflow to finish and only runs if it
# succeeded on main. workflow_dispatch also allows a manual trigger
# from the Actions tab.
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_USER: nizarharmach1
  RESOURCE_GROUP: rg-globalrentalcar
  API_URL: https://grc-api.gentletree-1896907b.francecentral.azurecontainerapps.io
  FRONTEND_URL: https://grc-frontend.gentletree-1896907b.francecentral.azurecontainerapps.io

permissions:
  id-token: write      # required for OIDC authentication to Azure
  contents: read

jobs:
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest

    # On workflow_run: only when CI is green and the branch is main.
    # On workflow_dispatch: always allowed.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout the commit that CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set image tag (short SHA)
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_USER }}/grc-api:${{ steps.vars.outputs.tag }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKER_USER }}/grc-frontend:${{ steps.vars.outputs.tag }}

      - name: Build & push AI service
        uses: docker/build-push-action@v6
        with:
          context: ./AI
          push: true
          tags: ${{ env.DOCKER_USER }}/grc-ai:${{ steps.vars.outputs.tag }}

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Record current revisions (for rollback)
        id: current
        run: |
          set -e
          for app in grc-api grc-frontend grc-ai; do
            rev=$(az containerapp revision list \
              --name "$app" --resource-group "$RESOURCE_GROUP" \
              --query "[?properties.active].name | [-1]" -o tsv)
            echo "${app}=${rev}" >> "$GITHUB_OUTPUT"
            echo "Current revision of $app: $rev"
          done

      - name: Deploy the new images
        run: |
          set -e
          TAG=${{ steps.vars.outputs.tag }}
          for app in grc-api grc-frontend grc-ai; do
            echo "Deploying $app:$TAG"
            az containerapp update \
              --name "$app" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$DOCKER_USER/$app:$TAG"
          done

      - name: Health check
        run: |
          echo "Checking the backend..."
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 5 --retry-all-errors \
            "$API_URL/up"

          echo "Checking the frontend..."
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 5 --retry-all-errors \
            "$FRONTEND_URL" > /dev/null

          echo "Deployment verified and healthy."

      # The AI service has internal-only ingress, so it cannot be reached
      # from a GitHub runner. It is deployed but not health-checked here.

      - name: Roll back on failure
        if: failure() && steps.current.outcome == 'success'
        run: |
          echo "Deployment failed - reverting to the previous revisions"
          for app in grc-api grc-frontend grc-ai; do
            prev=$(echo '${{ toJSON(steps.current.outputs) }}' | jq -r --arg a "$app" '.[$a] // empty')
            if [ -n "$prev" ]; then
              az containerapp revision activate \
                --revision "$prev" \
                --resource-group "$RESOURCE_GROUP" || true
              echo "$app restored to $prev"
            fi
          done
          exit 1